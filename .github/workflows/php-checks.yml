name: Laravel checks
on:
  push:
    branches: [group-buying, "fix/**"]
  pull_request:
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Lint PHP source
        run: find app bootstrap database public routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run application checks
        run: |
          php artisan route:list
          php artisan test
