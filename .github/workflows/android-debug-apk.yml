name: Android debug APK (test only)
on:
  push:
    branches: ["fix/**"]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "HTTPS staging API URL, e.g. https://staging.example.com/api"
        required: false
        type: string

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.7"
          cache: true
      - name: Install Flutter packages
        run: flutter pub get
      - name: Generate missing Android runner locally in CI only
        run: |
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            flutter create --platforms=android --project-name group_buying_app --org eg.gam3ni .
          fi
      - name: Build debug APK
        env:
          STAGING_API_URL: ${{ inputs.api_base_url || vars.STAGING_API_BASE_URL }}
        shell: bash
        run: |
          if [ -n "$STAGING_API_URL" ]; then
            if [[ ! "$STAGING_API_URL" =~ ^https://[^[:space:]]+/api/?$ ]]; then
              echo "::error::STAGING_API_BASE_URL must be an HTTPS URL ending in /api"
              exit 1
            fi
            flutter build apk --debug --dart-define=API_BASE_URL="$STAGING_API_URL"
          else
            echo "::warning::No staging API configured; APK will use emulator-only 10.0.2.2 and will not work against an external server on a phone."
            flutter build apk --debug
          fi
      - name: Save installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gam3ni-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
